services:
  tiago-sim:
    container_name: tiago-container
    image: fbe-dockerreg.rwu.de/prj-iki-ros2/robots/tiago/tiago_base:sim-ar

    environment:
      - DISPLAY=${DISPLAY}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/config/fastdds_shm.xml
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/root/.Xauthority

      - ../src:/root/iki_ws/src
      - ../scripts:/root/scripts
      - ../maps:/root/maps
      - ../models:/root/models
      - ../config:/root/config

      - ../my_bash_history:/root/.bash_history
      - ../my_bashrc:/root/.bashrc

      - ../models/sim_ar_ss26.launch.py:/root/tiago_ws/install/rwu_tiago_bringup/share/rwu_tiago_bringup/launch/sim/sim_ar_ss26.launch.py
      - ../models/ar_ss26:/root/ros2_ws/src/prj-iki-ros2/knowledgebase/iki_object_models/iki_object_models/models/ar_ss26

    working_dir: /root

    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true

    command:
      - bash
      - -c
      - |
        set -e

        # Source ROS/Gazebo setup directly, WITHOUT sourcing iki_ws
        # (that hasn't been built yet on a fresh container)
        export GAZEBO_MODEL_PATH=/root/ros2_ws/src/prj-iki-ros2/knowledgebase/iki_object_models/iki_object_models/models:/root/models
        source /ros_entrypoint.sh
        source /opt/ros/humble/setup.bash
        source /usr/share/gazebo/setup.bash
        source ~/tiago_ws/install/setup.bash
        source ~/ros2_ws/install/setup.bash
        export ROS_LOCALHOST_ONLY=0
        export ROS_DOMAIN_ID=3

        # Build the workspace containing your code
        cd /root/iki_ws
        colcon build
        source /root/iki_ws/install/setup.bash

        # Start the simulation
        ros2 launch rwu_tiago_bringup sim_ar_ss26.launch.py \
          is_public_sim:=True x:=-3.0 y:=1.0 yaw:=-1.5 \
          navigation:=True slam:=False \
          map_path:=/root/maps/map_ar_ss26.yaml \
          nav_config:=/root/config/tiago_custom_fullrunv9.yaml &
        SIM_PID=$$!

        # Give Gazebo/Nav2 time to come up before we start the action server
        sleep 25

        # Start the fullrunfinal action server (localizes + navigates per
        # goal's task field — no separate pose push and no goal is sent here)
        ros2 run fullrun fullrunfinal &
        ACTION_PID=$$!

        # Start the costmap clearer
        ros2 run tf_follower costmap_clearer --ros-args -p clear_interval_sec:=3.0

        wait $$SIM_PID $$ACTION_PID